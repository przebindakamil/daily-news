name: Deploy Daily News website

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "styles.css"
      - "audit.js"
      - "audit.css"
      - "secure/audits/**"
      - "data/rewind/**"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p _site/secure/audits
          cp index.html script.js styles.css audit.js audit.css _site/
          cp -r data _site/data
          if [ -d secure/audits ]; then
            cp -r secure/audits/. _site/secure/audits/
          fi
          touch _site/.nojekyll
      - name: Verify Pages entrypoint and public assets
        run: |
          test -s _site/index.html
          test -s _site/script.js
          test -s _site/audit.js
          test -s _site/data/archive/index.json
          grep -q 'id="audit-login"' _site/index.html
          test ! -d _site/reports
          echo "Verified GitHub Pages root index.html and admin login assets."
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed website over HTTPS
        shell: bash
        run: |
          url="https://przebindakamil.github.io/daily-news/"
          for attempt in 1 2 3 4 5 6 7 8; do
            status=$(curl -L -sS --max-time 20 -o /tmp/daily-news-live.html -w '%{http_code}' "$url?verification=${GITHUB_SHA}" || true)
            if [[ "$status" == "200" ]] && grep -q 'DAILY NEWS' /tmp/daily-news-live.html; then
              echo "GitHub Pages is serving the Daily News HTML (HTTP 200)."
              exit 0
            fi
            echo "Attempt $attempt: received HTTP $status instead of the Daily News page."
            sleep 10
          done
          echo "::error::Deployment reported success, but public GitHub Pages did not return Daily News."
          exit 1
