name: Backfill story context once

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backfill-story-context.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check source grouping and chronology
        run: python -m unittest discover -s tests -p "test_story_intelligence.py" -v
      - name: Add missing metadata to public archive
        run: python scripts/backfill_story_data.py
      - name: Save public archive and current issue
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive data/current.json data/news.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "Backfill public story context without AI calls"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build static site without private editorial files
        run: |
          mkdir -p _site/secure/audits
          cp index.html script.js styles.css audit.js audit.css _site/
          cp -r data _site/data
          if [ -d secure/audits ]; then cp -r secure/audits/. _site/secure/audits/; fi
          touch _site/.nojekyll
          test ! -d _site/reports
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: backfill
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
