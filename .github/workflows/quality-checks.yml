name: Code quality checks

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "script.js"
      - "audit.js"
      - "audit.css"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax and behavior
        run: |
          node --check script.js
          node --check audit.js
          node --test tests/test_feedback_ui.mjs tests/test_week1_ui.mjs tests/test_story_ui.mjs
      - name: Verify audit assets
        run: |
          grep -q 'id="audit-view"' index.html
          grep -q 'id="audit-login"' index.html
          grep -q 'src="audit.js"' index.html
          if grep -q 'data-view-link="audit"' index.html; then
            echo "Public audit navigation must not be visible."
            exit 1
          fi
          if test -d reports/audits || test -d reports/coverage; then
            echo "Plaintext internal data must not be tracked."
            exit 1
          fi
          grep -q 'secure/audits' .github/workflows/deploy-site.yml
