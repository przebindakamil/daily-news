name: Daily news

on:
  workflow_dispatch:
  schedule:
    # Every day at 06:00 Polish local time (handles DST automatically).
    - cron: "0 6 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify calendar-day selection
        run: python -m unittest discover -s tests -v

      - name: Generate yesterday's complete daily news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          NEWS_PER_CATEGORY: "2"
        run: python scripts/generate_news.py

      - name: Commit updated news and archive
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/current.json data/archive reports/coverage
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "Publish previous-day Daily News"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare website for publication
        run: |
          mkdir -p _site
          cp index.html script.js styles.css _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - name: Upload website for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
